# Add inside the HTTPS server block of the ledger site, before "location / { ... }".
# nginx asks the ledger (GET /api/sso) before every request; only the platform owner gets through, and the
# ledger's answer (X-Ledger-User) is passed on, replacing any header of that name the browser sent.

location = /_lab_auth {
    internal;
    proxy_pass http://127.0.0.1:5090/api/sso;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location /lab/ {
    auth_request /_lab_auth;
    auth_request_set $lab_user $upstream_http_x_ledger_user;
    error_page 401 403 = @lab_signin;
    proxy_set_header X-Ledger-User $lab_user;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_pass http://127.0.0.1:8010/;
}
# the API answers 401 in JSON instead of redirecting, so the page can say the session ended
location /lab/api/ {
    auth_request /_lab_auth;
    auth_request_set $lab_user $upstream_http_x_ledger_user;
    error_page 401 403 = @lab_denied;
    proxy_set_header X-Ledger-User $lab_user;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_pass http://127.0.0.1:8010/api/;
}
location = /lab { return 301 /lab/; }
location @lab_signin { return 302 /; }
location @lab_denied {
    default_type application/json;
    return 401 '{"detail":"请先登录美股账本"}';
}
