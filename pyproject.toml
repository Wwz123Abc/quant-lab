[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
dynamic = ["version"]
description = "Research workstation for US and Hong Kong stocks: backtests, out-of-sample scans and paper trading"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
ml = ["lightgbm>=4.5"]
# TradingAgents is not on PyPI; it is pinned to one reviewed commit and upgraded deliberately.
ai = ["tradingagents @ git+https://github.com/TauricResearch/TradingAgents@e8f5503e9b86d5c2710b0c76b1f686703968c9df"]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.dynamic]
version = { attr = "quantlab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantlab = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]
ignore = [
    "E731",   # small lambdas for formatting read better inline
    "E741",   # l for low prices mirrors open/high/low/close
    "UP031",  # %-formatting is used throughout for aligned console output
    "SIM108",
    "C408",   # dict(cash=..., fee=...) keyword style is used for keyword-argument bundles
]

[tool.ruff.lint.per-file-ignores]
"src/quantlab/core/charts.py" = ["E402"]  # matplotlib backend must be chosen before pyplot is imported
